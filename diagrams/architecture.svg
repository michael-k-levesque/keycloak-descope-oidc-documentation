<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="625" viewBox="0 0 1300 625" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Keycloak to Descope: OIDC federation laboratory architecture</title>
<desc id="figure-desc">A test browser starts a Descope SSO flow, interacts with Keycloak through an ngrok HTTPS tunnel and Nginx proxy, and returns to Descope for a session and Just-in-Time user record. Group captions appear in padded footer boxes. Dashed blue indicates front-channel browser traffic; purple indicates the back-channel token exchange; slate lines indicate internal relationships.</desc>
<defs>
 <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#53677E"/></marker>
 <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#0E8197"/></marker>
 <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7553A8"/></marker>
 <marker id="arrow-reverse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#53677E"/></marker>
 <style>
  .frame{fill:#F9FBFD;stroke:#D4DEE9;stroke-width:2}
  .node{fill:#FFF;stroke:#A8B8CA;stroke-width:2}
  .node-text{fill:#1F3246;font:600 17px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
  .subnode{fill:#FFF;stroke-width:2}
  .subtext{fill:#22374E;font:600 16px system-ui,-apple-system,"Segoe UI",sans-serif;text-anchor:middle}
  .footer{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.9px;text-anchor:middle}
  .legend{font:500 14px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#374B60}
  .note{font:400 13px system-ui,-apple-system,"Segoe UI",sans-serif;fill:#61758B}
  .path-slate{stroke:#53677E;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .path-teal{stroke:#0E8197;stroke-width:2.6;fill:none;stroke-dasharray:9 7;stroke-linecap:round;stroke-linejoin:round}
  .path-purple{stroke:#7553A8;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<!-- The enclosing boundaries have 28–32 px side insets, padded footer labels,
     and additional vertical whitespace between functional components and captions. -->
<rect x="1" y="1" width="1298" height="623" rx="18" fill="#FFFFFF" stroke="#E0E7EF" stroke-width="2"/>

<text x="54" y="66" style="font:700 20px system-ui,-apple-system,Segoe UI,sans-serif; fill:#243C54">OIDC SSO · Logical architecture</text>
<text x="54" y="93" style="font:400 14px system-ui,-apple-system,Segoe UI,sans-serif; fill:#64788C">Verified laboratory components and trust boundaries</text>

<!-- Trust zones: border and footer labels are separate so captions never collide with paths. -->
<rect class="frame" x="324" y="121" width="332" height="309" rx="16"/>
<rect class="frame" x="954" y="121" width="296" height="309" rx="16"/>

<!-- All connections are drawn first and terminate at component box boundaries. -->
<!-- Browser/Descope interaction is bidirectional. -->
<path class="path-slate" d="M244 220 H280 V187 H355" marker-start="url(#arrow-reverse)" marker-end="url(#arrow-slate)"/>
<!-- Descope OIDC back channel to the public IdP ingress. -->
<path class="path-purple" d="M625 187 H680 V232 H719" marker-end="url(#arrow-purple)"/>
<!-- External browser authorization and sign-in through public IdP ingress. -->
<path class="path-teal" d="M149 290 V472 H813 V279" marker-end="url(#arrow-teal)"/>
<!-- Public ingress through Nginx to Keycloak. -->
<path class="path-slate" d="M908 232 H936 V187 H983" marker-end="url(#arrow-slate)"/>
<path class="path-slate" d="M1102 228 V266" marker-end="url(#arrow-slate)"/>
<path class="path-slate" d="M490 228 V266" marker-end="url(#arrow-slate)"/>

<!-- Browser and tunnel -->
<rect class="node" x="54" y="176" width="190" height="114" rx="13"/>
<text class="node-text" x="149" y="217"><tspan x="149">Browser</tspan><tspan x="149" dy="25" font-size="15" font-weight="400">Test user</tspan></text>
<rect x="719" y="186" width="189" height="93" rx="13" fill="#FFF9ED" stroke="#CDB880" stroke-width="2"/>
<text class="node-text" x="813.5" y="222"><tspan x="813.5">ngrok HTTPS</tspan><tspan x="813.5" dy="24">tunnel</tspan></text>

<!-- Descope cloud inner nodes; consistent 31–32 px left/right content padding -->
<rect class="subnode" x="355" y="146" width="270" height="82" rx="11" stroke="#B8A2DD" fill="#F9F5FF"/>
<text class="subtext" x="490" y="181"><tspan x="490">Interactive SSO Flow</tspan><tspan x="490" dy="23" font-size="14" font-weight="400">Authorization Code</tspan></text>
<rect class="subnode" x="355" y="266" width="270" height="82" rx="11" stroke="#B8A2DD" fill="#F9F5FF"/>
<text class="subtext" x="490" y="301"><tspan x="490">Descope session</tspan><tspan x="490" dy="23" font-size="14" font-weight="400">+ JIT user record</tspan></text>

<!-- Local lab inner nodes; identical horizontal padding -->
<rect class="subnode" x="983" y="146" width="238" height="82" rx="11" stroke="#A5CECB" fill="#F1FAF9"/>
<text class="subtext" x="1102" y="182"><tspan x="1102">Nginx</tspan><tspan x="1102" dy="23" font-size="14" font-weight="400">OIDC route proxy</tspan></text>
<rect class="subnode" x="983" y="266" width="238" height="82" rx="11" stroke="#A5CECB" fill="#F1FAF9"/>
<text class="subtext" x="1102" y="301"><tspan x="1102">Keycloak</tspan><tspan x="1102" dy="23" font-size="14" font-weight="400">descope-lab realm</tspan></text>

<!-- Padded footer badges match component side insets (29–31px) and maintain 24px bottom clearance. -->
<rect x="355" y="365" width="270" height="41" rx="9" fill="#E9E2F8"/>
<text class="footer" x="490" y="390" fill="#5B4488">DESCOPE CLOUD</text>
<rect x="983" y="365" width="238" height="41" rx="9" fill="#DFF2EF"/>
<text class="footer" x="1102" y="390" fill="#245B57">LOCAL LAB · DOCKER / WSL 2</text>

<!-- Legend is below every route, preserving the clear diagram boundary. -->
<line x1="52" y1="506" x2="1248" y2="506" stroke="#DCE5EE" stroke-width="1.5"/>
<path d="M82 544 H133" class="path-slate" marker-end="url(#arrow-slate)"/>
<text class="legend" x="148" y="550">Flow and internal links</text>
<path d="M438 544 H489" class="path-teal" marker-end="url(#arrow-teal)"/>
<text class="legend" x="503" y="550">Browser authorization (front channel)</text>
<path d="M888 544 H939" class="path-purple" marker-end="url(#arrow-purple)"/>
<text class="legend" x="953" y="550">Token exchange (back channel)</text>
<text class="note" x="650" y="595" text-anchor="middle">Logical architecture only — not a packet trace or production deployment reference</text>
</svg>